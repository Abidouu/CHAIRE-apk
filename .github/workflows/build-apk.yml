name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      # ÉTAPE AJOUTÉE : Injection automatique du namespace si manquant dans build.gradle
      - name: Fix Namespace in build.gradle
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "namespace" "$BUILD_GRADLE"; then
              echo "Ajout du namespace dans $BUILD_GRADLE..."
              sed -i '/android {/a \    namespace "com.example.chaire"' "$BUILD_GRADLE"
            fi
          fi

      - name: Installer les dépendances du projet
        run: flutter pub get

      - name: Compiler l'APK
        run: flutter build apk --release

      - name: Mettre l'APK à disposition en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
